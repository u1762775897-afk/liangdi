<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>栖居 Atelier · 客餐厅3D设计</title><style>body{margin:0;background:#151a19;color:#f5f1e8;font:14px system-ui}header{padding:18px 22px;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:3px 0}small{color:#bda98d}#viewer{height:70vh;min-height:430px;position:relative;background:radial-gradient(#ded9cf,#a7aaa7);touch-action:none;overflow:hidden}canvas{display:block;width:100%;height:100%}.hint{position:absolute;top:16px;left:16px;background:#202523bd;padding:9px 13px;border-radius:9px;color:white}.controls{padding:15px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center}button{background:#303936;color:white;border:1px solid #66716b;padding:11px 16px;border-radius:9px;cursor:pointer}button.active{background:#c8aa80;color:#18201e;border-color:#c8aa80}.note{padding:5px 22px 25px;color:#c6c5bb;line-height:1.8}#status{position:absolute;bottom:12px;left:16px;color:#fff;background:#252c2bba;padding:9px;border-radius:8px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><div><small>ATELIER · INTERIOR DESIGN</small><h1>栖居｜客厅 × 餐厅</h1></div><small>亚朵暖木 × 欧洲现代</small></header><div id="viewer"><div class="hint">手指拖动旋转 · 双指缩放</div><div id="status">整体空间 · 设计概念模型</div></div><div class="controls"><button data-view="all" class="active">整体</button><button data-view="living">客厅</button><button data-view="window">窗边柜</button><button data-view="dining">餐厅</button><button data-theme="warm" class="active">亚朵暖木</button><button data-theme="walnut">欧洲胡桃</button><button data-theme="stone">米兰浅石</button></div><div class="note">依据现场照片进行空间关系示意：保留黑框落地窗、白色吊顶与浅色地砖；左侧电视背景墙，右侧沙发，窗右侧窄柜预留检修与扫地机器人位置。餐厅保持通道畅通。无钢琴、无书桌。<br>提示：这是可旋转的概念3D设计，非实测施工图；柜体尺寸、管道及门洞需现场复核。</div><script type="module">import * as T from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const host=document.querySelector('#viewer');const scene=new T.Scene();scene.background=new T.Color('#d5d4cd');const camera=new T.PerspectiveCamera(48,host.clientWidth/host.clientHeight,.1,100);camera.position.set(8,6,10);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);renderer.shadowMap.enabled=true;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.7;host.prepend(renderer.domElement);const ctl=new OrbitControls(camera,renderer.domElement);ctl.enableDamping=true;ctl.target.set(0,1.1,0);ctl.minDistance=2;ctl.maxDistance=22;ctl.maxPolarAngle=Math.PI*.48;scene.add(new T.HemisphereLight(0xffffff,0x88817a,2.5));const sun=new T.DirectionalLight(0xffeddb,3);sun.position.set(-4,9,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);let group=new T.Group();scene.add(group);const palettes={warm:{wood:0x94745a,accent:0xc2a181,stone:0xd8cfc1,wall:0xf3f0ea,sofa:0x88827a},walnut:{wood:0x523e32,accent:0x97765c,stone:0xcac0b5,wall:0xedeae5,sofa:0x77716e},stone:{wood:0x8d8277,accent:0xc2b8aa,stone:0xe3ddd5,wall:0xf6f4ef,sofa:0x737c7b}};function mat(c,metal=0){return new T.MeshStandardMaterial({color:c,roughness:.78,metalness:metal,side:T.DoubleSide})}function cube(w,h,d,x,y,z,c){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m}function build(k){scene.remove(group);group=new T.Group();scene.add(group);const p=palettes[k];cube(5.4,.08,9,0,-.04,0,0xe9e4db);cube(.12,2.85,9,-2.7,1.4,0,p.wall);cube(5.4,2.85,.12,0,1.4,4.5,p.wall);cube(5.4,.12,9,0,2.85,0,p.wall);cube(5.4,.13,3.7,0,2.82,-2.65,0xf9f8f5);cube(5.4,.13,3.5,0,2.82,2.7,0xf9f8f5);cube(5.4,.07,.1,0,2.68,-4.35,0xf5e5c9);const glass=new T.Mesh(new T.PlaneGeometry(5.1,2.65),new T.MeshPhysicalMaterial({color:0x93b5c1,transparent:true,opacity:.29,roughness:.1,metalness:.2,side:T.DoubleSide}));glass.position.set(0,1.37,-4.44);group.add(glass);for(const x of [-2.58,-.85,.85,2.58])cube(.055,2.7,.07,x,1.37,-4.43,0x343c3d);cube(5.2,.055,.08,0,1.5,-4.42,0x343c3d);cube(.22,2.65,.25,-2.38,1.35,-4.2,0xc9baa6);cube(.22,2.65,.25,2.38,1.35,-4.2,0xc9baa6);cube(.11,2.25,2.7,-2.56,1.28,-1.65,p.wood);cube(.13,1.7,2.0,-2.44,1.45,-1.65,p.stone);cube(.15,1.08,1.52,-2.32,1.55,-1.65,0x20282a);cube(.48,.28,2.45,-2.34,.32,-1.65,p.wood);for(let z=-2.9;z<-.4;z+=.12)cube(.045,2.05,.035,-2.45,1.36,z,p.accent);cube(2.5,.38,.96,1.35,.37,-1.55,p.sofa);cube(2.5,.7,.23,1.35,.78,-2.01,p.sofa);cube(.22,.6,1,2.52,.55,-1.55,p.sofa);cube(.22,.6,1,.18,.55,-1.55,p.sofa);cube(2.9,.025,1.9,.15,.08,-1.4,0xd0c7bb);cube(1.04,.11,.62,.15,.42,-1.4,p.stone);cube(.4,.34,.35,.15,.23,-1.4,p.wood);cube(.73,2.4,.67,2.27,1.2,-3.76,p.wood);cube(.67,.55,.61,2.27,.3,-3.74,0xdcd9d1);cube(.4,.12,.45,2.27,.14,-3.75,0xeae9e5);cube(1.5,.7,.45,-1.78,.42,2.55,p.wood);cube(1.75,.05,1.12,0,.1,2.1,0xc8bfb3);cube(1.55,.13,.88,.45,.78,2.1,p.stone);cube(.5,.72,.5,.45,.39,2.1,p.wood);for(const x of [-.65,1.55]){cube(.48,.15,.46,x,.43,2.1,p.accent);cube(.48,.64,.12,x,.76,1.87,p.sofa)}for(const z of [1.35,2.85]){cube(.48,.15,.46,.45,.43,z,p.accent);cube(.48,.64,.12,.45,.76,z-.23,p.sofa)}cube(.025,.7,.025,.45,2.34,2.1,p.wood);cube(.75,.1,.75,.45,1.96,2.1,0xe6d0a8);for(const z of [-3.6,-.5,2.2,3.9])cube(.9,.025,.025,-1.6,2.7,z,0xf5e1ba)}build('warm');function view(v){const target={all:[[8,6,10],[0,1.1,0]],living:[[5,3.4,-.4],[0,1,-2]],window:[[4,2.7,-1.7],[1.65,1.1,-3.6]],dining:[[5,3.5,6.8],[0,1,2.2]]}[v];camera.position.set(...target[0]);ctl.target.set(...target[1]);ctl.update();document.querySelector('#status').textContent={all:'整体空间 · 客厅与餐厅',living:'客厅 · 电视墙与沙发',window:'窗边柜 · 检修与机器人位',dining:'餐厅 · 轻量收纳与通道'}[v];document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{build(b.dataset.theme);document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('active',x===b))});new ResizeObserver(()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)}).observe(host);function tick(){requestAnimationFrame(tick);ctl.update();renderer.render(scene,camera)}tick();</script></body></html>
