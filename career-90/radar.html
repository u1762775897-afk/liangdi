<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全职业招聘雷达｜梁迪</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#192c40;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#172c43;color:#fff;padding:30px max(18px,calc((100vw - 1000px)/2))}h1{margin:0;font-size:26px}header p{color:#cbd5e1;margin:5px 0}main{max-width:1000px;margin:auto;padding:20px 14px 70px}.bar,.card{background:#fff;border:1px solid #e2e8ef;border-radius:14px;padding:16px;margin:0 0 12px}button,select{font:inherit;border:1px solid #cad4df;border-radius:9px;padding:8px 11px;background:#fff;color:#1b344e;cursor:pointer}button.primary{background:#172c43;color:white}button.danger{color:#a43838}button:focus-visible{outline:3px solid #93c5fd}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tag{font-size:12px;border-radius:5px;background:#edf2f7;padding:3px 7px}.muted{color:#607086;font-size:13px}.head{display:flex;justify-content:space-between;gap:10px;align-items:start}.head h3{margin:0;font-size:18px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.facts div{background:#f5f7fa;border-radius:8px;padding:8px}.facts b{display:block;font-size:12px;color:#64748b}a{color:#245b9b}details{margin-top:8px}.small{font-size:12px}.notice{background:#fff7e9;padding:12px;border-radius:9px}#empty{display:none}@media(max-width:640px){.facts{grid-template-columns:repeat(2,1fr)}.head{display:block}}.card{touch-action:pan-y;position:relative;transition:transform .15s,box-shadow .15s}.card.starred{border:2px solid #e9b64a;background:#fffdf5}.swipe-help{display:flex;gap:10px;flex-wrap:wrap}.swipe-help span{background:#eef4fa;padding:4px 10px;border-radius:20px;font-size:13px}.starbtn{color:#93620b;border-color:#f1cc71;background:#fff9e8}.starbtn.on{background:#ffe7a0;font-weight:700}.card.swiping{transition:none}</style></head><body><header><h1>全职业招聘雷达</h1><p>先按赚钱能力、人脉、时间自由和职业成长筛选；不再局限音乐教师</p><a href="./index.html" style="color:#fff">返回人生决策中心</a></header><main><div class="bar"><b>岗位方向排序（不是实时在招公告）</b><p class="muted">下列为适合探索的职业方向及职责说明，薪资未取得可核实的具体企业公告时不填写虚构数字。实际岗位上线后应逐条附原公告、截止日期、薪资口径。</p><div class="tools"><select id="area" aria-label="地区"><option value="all">全部地区</option><option>深圳＋东莞</option><option>珠三角</option><option>浙江</option><option>福建</option><option>全国</option></select><select id="type" aria-label="方向"><option value="all">全部职业</option><option>商业教育</option><option>高校教育</option><option>公办教师</option><option>企业职能</option><option>艺术文化</option></select><select id="state" aria-label="显示"><option value="active">未删除</option><option value="hidden">已删除（可恢复）</option><option value="all">全部</option></select><button id="reset">恢复所有已删除项</button></div><p id="count" class="muted"></p><div class="notice small">删除会保存在<b>当前浏览器</b>，以后打开本页面不会再出现；换手机、清理浏览器数据或更换域名可能无法同步。删除只隐藏你的视图，不删除招聘公告，也不保证其他雷达同步。</div></div><div class="bar swipe-help"><span>← 左滑：不再推荐</span><span>右滑：⭐ 标重点 →</span><span>也可点击按钮操作</span></div><div id="cards"></div><p id="empty" class="bar">当前筛选没有结果。可切换地区或在“已删除”中恢复。</p></main><script>

{id:"marketing",rank:6,name:"品牌市场／活动策划／用户运营",type:"企业职能",area:"珠三角",nature:"民企／上市公司／国企子公司，逐企业核实",work:"策划品牌活动、管理社媒内容、合作推广、客户增长和数据复盘。",fit:"部分岗位专业不限；演出活动策划经验可迁移，需补作品集与数据技能。",pay:"按具体公司及职级核实固定薪资、奖金和加班",campus:"管培生／校招／社招均可能",pros:"行业迁移性强；工作节奏与成长取决于企业",risk:"中"},
{id:"state",rank:7,name:"国企综合管理／培训专员／企业文化",type:"企业职能",area:"珠三角",nature:"国有企业（须核实用工主体，劳务派遣不等于正式员工）",work:"员工培训、活动组织、企业文化宣传、行政协调和项目管理。",fit:"部分岗位不限专业；也有严格专业目录、应届年份及党员条件。",pay:"工资、绩效、年终奖、补充福利分项核实",campus:"国企校招多有限定毕业届别；社招另核",pros:"稳定性和组织资源可能较好；入门竞争激烈",risk:"低"},
{id:"arts",rank:8,name:"文化馆／艺术中心／剧院项目运营",type:"艺术文化",area:"浙江",nature:"事业单位／国企／民营文化机构均有",work:"组织演出、群众艺术活动、场馆运营、艺术普及与项目执行。",fit:"音乐学与演出经验匹配；部分事业编需考试及专业限制。",pay:"以岗位实际公告为准；事业编与项目制不能混比",campus:"公开招聘／社招",pros:"专业资源与演出网络较好；项目周期可能占用周末",risk:"中"},

];const key="liangdi_radar_hidden_v1",starKey="liangdi_radar_starred_v1";let starred;try{starred=new Set(JSON.parse(localStorage.getItem(starKey)||"[]"))}catch(e){starred=new Set()}function saveStar(){try{localStorage.setItem(starKey,JSON.stringify([...starred]))}catch(e){}}function toggleStar(id){starred.has(id)?starred.delete(id):starred.add(id);saveStar();render()}let hidden;try{hidden=new Set(JSON.parse(localStorage.getItem(key)||"[]"))}catch(e){hidden=new Set()}const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function save(){try{localStorage.setItem(key,JSON.stringify([...hidden]))}catch(e){}}function render(){const area=$("area").value,type=$("type").value,state=$("state").value;let data=jobs.filter(j=>(area==="all"||j.area===area)&&(type==="all"||j.type===type)&&(state==="all"||(state==="hidden"?hidden.has(j.id):!hidden.has(j.id)))).sort((a,b)=>Number(starred.has(b.id))-Number(starred.has(a.id))||a.rank-b.rank);$("count").textContent="显示 "+data.length+" 个职业方向｜已隐藏 "+hidden.size+" 个";$("empty").style.display=data.length?"none":"block";$("cards").innerHTML=data.map(j=>'<article class="card"><div class="head"><div><span class="tag">优先级 '+j.rank+'</span> <span class="tag">'+esc(j.area)+'</span> <span class="tag">'+esc(j.type)+'</span><h3>'+esc(j.name)+'</h3></div><button class="'+(hidden.has(j.id)?'primary':'danger')+'" data-id="'+j.id+'">'+(hidden.has(j.id)?'恢复显示':'删除·不再推荐')+'</button></div><div class="facts"><div><b>工作内容</b>'+esc(j.work)+'</div><div><b>专业是否匹配</b>'+esc(j.fit)+'</div><div><b>企业／单位性质</b>'+esc(j.nature)+'</div><div><b>薪资与绩效</b>'+esc(j.pay)+'</div><div><b>校招还是社招</b>'+esc(j.campus)+'</div><div><b>发展前景及代价</b>'+esc(j.pros)+'</div></div><p class="muted">职业方向推荐，非具体在招岗位。当前未核实企业名称、岗位截止日期及实际工资。</p></article>').join("");document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{const id=b.dataset.id;hidden.has(id)?hidden.delete(id):hidden.add(id);save();render()});document.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>toggleStar(b.dataset.star));document.querySelectorAll("[data-swipe]").forEach(card=>{let x=0,y=0,active=false;card.addEventListener("touchstart",e=>{if(e.target.closest("button,a,select,input"))return;x=e.touches[0].clientX;y=e.touches[0].clientY;active=true},{passive:true});card.addEventListener("touchend",e=>{if(!active)return;active=false;const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)<85||Math.abs(dx)<Math.abs(dy)*1.5)return;const id=card.dataset.swipe;if(dx<0){hidden.add(id);save();render()}else toggleStar(id)},{passive:true})})}["area","type","state"].forEach(id=>$(id).onchange=render);$("reset").onclick=()=>{if(confirm("恢复所有已删除职业方向？")){hidden.clear();save();render()}};render();</script></body></html>
