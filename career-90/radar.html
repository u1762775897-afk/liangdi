<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142c44"><title>广东浙江招聘与双选会雷达｜职业部署规划</title><link rel="stylesheet" href="./site-v2.css"><style>.radar-shell{max-width:850px;margin:0 auto;padding:20px 12px 80px}.radar-title{background:linear-gradient(120deg,#163149,#315f82);border-radius:17px;padding:21px;color:#fff}.radar-title h1{font-size:22px;margin:5px 0}.radar-title p{font-size:12px;color:#d5e3ed}.radar-links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.radar-links a{background:#fff;border:1px solid #d7e2ec;color:#244e70;padding:9px 12px;border-radius:9px;font-size:12px;font-weight:800}.fair-card{padding:14px;margin:9px 0;background:#fff;border:1px solid #e1e8ef;border-radius:12px}.fair-card strong{display:block;font-size:14px}.fair-card p{font-size:11px;color:#667c91;margin:5px 0}.fair-card .date{font-size:11px;color:#a33443;font-weight:800}.fair-card a{display:inline-block;margin-top:6px;font-size:12px;font-weight:800}.pulse{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.pulse>div{background:#fff;border:1px solid #dce6ef;padding:12px;border-radius:10px}.pulse strong{display:block;font-size:19px}.pulse small{font-size:10px;color:#697d91}@media(max-width:400px){.radar-title h1{font-size:19px}.radar-shell{padding:12px 10px 70px}.radar-links a{font-size:11px;padding:8px}}</style></head><body><main class="radar-shell"><div class="radar-title"><small>SHARED RECRUITMENT DATA</small><h1>广东浙江招聘与双选会雷达</h1><p>与职业部署规划共用同一份 GitHub 招聘数据库。以广东、浙江为主，扩展福建、江浙沪与京津沿海；深圳优先。</p></div><nav class="radar-links"><a href="./index.html#home">职业部署规划</a><a href="./index.html#teacher">教师招聘</a><a href="./index.html#career">职业招聘</a><a href="./index.html#pay">薪酬分析</a><a href="./sources.html">招聘网站库（188条入口）</a></nav><div class="pulse" id="p"><div><small>教师记录</small><strong>—</strong></div><div><small>非教师记录</small><strong>—</strong></div><div><small>待举行招聘会</small><strong>—</strong></div></div><div class="section"><h2>最新招聘会／双选会</h2><small id="sync">正在读取</small></div><div id="fairs"><div class="panel">正在读取共享招聘信息。</div></div><div class="section"><h2>招聘入口</h2></div><div class="panel"><p>招聘会并不等于存在音乐教师岗位。具体职位、薪资、应届身份与留服认证要求以单位公告和岗位表为准。</p><div class="radar-links"><a href="./index.html#teacher">查看音乐教师岗位</a><a href="./index.html#career">查看大学行政／事业单位／企业</a></div></div><footer class="end">招聘快照，不是实时自动爬取 · 所有岗位与职业部署规划共用 jobs.js</footer></main><script src="./jobs.js"></script><script>(function(){const d=window.CAREER_SCAN||{jobs:[],meetings:[]};const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const now=new Date();const fmt=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).format(now).replaceAll("/","-");const fairs=(d.meetings||[]).filter(m=>(m.time||"")>=fmt).sort((a,b)=>a.time.localeCompare(b.time));document.getElementById("p").innerHTML=[["教师记录",d.jobs.filter(x=>x.type==="teacher").length],["非教师记录",d.jobs.filter(x=>x.type==="career").length],["待举行招聘会",fairs.length]].map(x=>'<div><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join("");document.getElementById("sync").textContent="最近核验 "+(d.verifiedAsOf||"未记录");document.getElementById("fairs").innerHTML=fairs.length?fairs.map(m=>'<article class="fair-card"><span class="date">'+e(m.time)+'</span><strong>'+e(m.title)+'</strong><p>'+e(m.city)+' · '+e(m.mode||"活动形式待核")+'</p><p>'+e(m.note||"")+'</p><a href="'+e(m.url)+'" target="_blank" rel="noopener noreferrer">查看活动来源 ↗</a></article>').join(""):'<div class="panel">目前未收录日期尚未来到的招聘会，请继续查看学校官方就业平台。</div>';})();</script></body></html>
