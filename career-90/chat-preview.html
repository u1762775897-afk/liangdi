<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>职业规划助手预览</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#f5f6f8;color:#1b2739}
    main{max-width:760px;margin:12vh auto;padding:24px}
    .card{background:white;border:1px solid #e4e8ee;border-radius:16px;padding:28px;box-shadow:0 5px 25px #1422380d}
    h1{font-size:clamp(25px,5vw,36px)}p{line-height:1.7;color:#526174}
  </style>
</head>
<body>
  <main><section class="card">
    <h1>90天职业行动计划</h1>
    <p>点击右下角的“职业规划助手”查看聊天入口预览。当前页面是独立预览；要让助手出现在正式计划页面，需要在 career-90/index.html 中引用 chat-widget.js。</p>
    <p>注意：GPT 还没有连接。启用真实 AI 回复前，需要部署安全的 /api/chat 后端，并在服务器环境变量中配置 API 密钥。不要把密钥放到网页代码里。</p>
  </section></main>
  <script src="./chat-widget.js"></script>
</body>
</html>
